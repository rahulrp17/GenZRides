# Keep the Render free-tier backend warm so users never hit a cold start.
# Pings GET /health every 10 minutes. Render spins down after ~15 min of
# inactivity, so this keeps one instance alive around the clock.
# Cost: ~4,300 runs/month x ~10s each — well within GitHub's free quota.
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          URL="${BACKEND_URL:-https://genzrides-backend.onrender.com}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL/health")
          echo "Health check returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Backend health check returned $HTTP_CODE"
            exit 1
          fi
